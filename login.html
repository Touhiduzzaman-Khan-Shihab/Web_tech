<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>
    <h1 id="title">Login</h1>

    <form id="loginForm" action="#" method="post">
        
        <label for="email" id="emailLabel">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="pass" id="passLabel">Password:</label>
        <input type="password" id="pass" name="pass" required><br><br>

        <input type="submit" id="loginBtn" value="Login"> <br><br>

        <label class="checkbox" id="rememberLabel">
            <input type="checkbox" id="remember" name="remember"> Remember me
        </label>
        <a href="#" id="forgotLink">Forgot Password</a>
    </form>

    <p id="registerText">Don't have an account?</p>
    <a href="#" id="registerLink">Register here</a>

</body>
</html>
