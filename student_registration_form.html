<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label>Password:</label> <input type="password" name="pass" required><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required><br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="">Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select><br><br>

        <label for="city">City:</label>
        <select id="city" name="city">
            <option value="Dhaka">Dhaka</option>
            <option value="Khulna">Khulna</option>
            <option value="Rajshahi">Rajshahi</option>
            <option value="Sylhet">Sylhet</option>
        </select><br><br>

        <p>Hobbies:</p>
        <input type="checkbox" name="hobby" value="reading"> Reading 
        <input type="checkbox" name="hobby" value="cricket"> Cricket 
        <input type="checkbox" name="hobby" value="music"> Music <br><br>

        <label>About Yourself:</label><br> 
        <textarea name="about yourself" rows="4" cols="40"></textarea><br><br>

        <input type="submit" value="Send"> 
        <input type="reset" value="Clear">

</body>
</html>
